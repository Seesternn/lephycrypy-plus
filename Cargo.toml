[workspace]
resolver = "3"
members = [
    "crates/lephy-sys",
    "crates/lephy-core",
    "crates/lephy-cli",
    "crates/lephy-usb",
    "crates/lephy-gui",
]
# fuzz/ is its own workspace (cargo-fuzz, nightly); it is not part of the main graph or cargo-deny.
exclude = ["fuzz"]
# crates/lephy-usb and crates/lephy-gui are members too.

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/lephycrypy/lephycrypy-plus"
publish = false

[workspace.dependencies]
lephy-sys = { path = "crates/lephy-sys" }
lephy-core = { path = "crates/lephy-core" }
lephy-usb = { path = "crates/lephy-usb" }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
thiserror = "2"
subtle = { version = "2", default-features = false }
clap = { version = "4", features = ["derive"] }
# Cryptography (versions with zeroize support). All from the RustCrypto 0.11/0.6 generation.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "zeroize"] }
aead = { version = "0.6", default-features = false }
argon2 = { version = "0.6", default-features = false, features = ["zeroize"] }
hkdf = { version = "0.13", default-features = false }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
digest = { version = "0.11", default-features = false, features = ["zeroize"] }
# `pure`: no C/asm back end (drops the cc crate and the C compiler dependency; only small inputs are hashed).
blake3 = { version = "1.8", default-features = false, features = ["zeroize", "pure"] }
getrandom = { version = "0.4", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
cap-std = "4"
# Raw DEFLATE (compression, format v2). Pure Rust, forbid(unsafe_code); already in the GUI tree.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
# X25519 for recipient (public-key) encryption. Pure Rust, no digest/rand features.
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }

# unsafe only in lephy-sys. lephy-sys uses its own [lints] table and does not write
# `workspace = true`; every other crate inherits this table.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
similar_names = "allow"
many_single_char_names = "allow"
disallowed_methods = "deny"
disallowed_types = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Tests need unwinding; panic=abort only for release binaries (where the hook is installed).
