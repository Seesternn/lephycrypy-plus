[workspace]
resolver = "3"
members = [
    "crates/lephy-sys",
    "crates/lephy-core",
    "crates/lephy-cli",
]
# 1.1: crates/lephy-usb — 1.2: crates/lephy-gui (PLAN.md, açık karar 4/22)

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lephycrypy/lephycrypy-plus"
publish = false

[workspace.dependencies]
lephy-sys = { path = "crates/lephy-sys" }
lephy-core = { path = "crates/lephy-core" }
zeroize = { version = "1", default-features = false }
thiserror = "2"
subtle = { version = "2", default-features = false }
clap = { version = "4", features = ["derive"] }

# R5-01: unsafe yalnızca lephy-sys'te. lephy-sys kendi [lints] tablosunu kullanır,
# `workspace = true` yazmaz; diğer tüm crate'ler bu tabloyu devralır.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
disallowed_methods = "deny"
disallowed_types = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Testler unwind ister; panic=abort yalnızca release ikililerinde (R5-04 hook'u orada kurulur).
