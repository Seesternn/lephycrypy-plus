[package]
name = "lephy-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Separate workspace: in the main workspace's `exclude` list. Runs only with nightly + cargo-fuzz.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
lephy-core = { path = "../crates/lephy-core" }
# The desktop preview's image decoder (same version and features as lephy-gui).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
debug = 1

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_entry"
path = "fuzz_targets/archive_entry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "names"
path = "fuzz_targets/names.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decrypt_known_key"
path = "fuzz_targets/decrypt_known_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "preview_image"
path = "fuzz_targets/preview_image.rs"
test = false
doc = false
bench = false
