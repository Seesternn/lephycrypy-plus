[package]
name = "lephy-usb"
description = "lephycrypy+ USB: wipe only removable USB media and write the encrypted file (#![forbid(unsafe_code)])"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lephy-core = { workspace = true }
lephy-sys = { workspace = true }
cap-std = { workspace = true }
blake3 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
# Free-space filling: ChaCha20 key stream (already in the tree; instead of rand_chacha + ppv-lite86 + zerocopy).
chacha20 = { version = "0.10", default-features = false, features = ["cipher", "zeroize"] }

[lints]
workspace = true
