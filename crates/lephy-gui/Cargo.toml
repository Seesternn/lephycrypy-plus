[package]
name = "lephy-gui"
description = "lephycrypy+ desktop app (egui/eframe; #![forbid(unsafe_code)])"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "lephycrypy-gui"
path = "src/main.rs"

[features]
# for the panic-hook test (same as the CLI); never enabled in distributed builds.
fault-injection = ["lephy-core/fault-injection"]

[dependencies]
lephy-core = { workspace = true }
lephy-sys = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
# Vault change detection (a fingerprint of the open folder).
blake3 = { workspace = true }

# persistence off, clipboard off, embedded fonts (default_fonts:
# Ubuntu/UFL + emoji/OFL) off — a system font is loaded at run time. glow (OpenGL):
# a much smaller dependency tree than wgpu. There is no GUI on Linux (it would need
# wayland/x11 system libraries): the binary says "not supported".
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit"] }
# File open/save dialogs (native NSOpenPanel / IFileDialog); Linux back ends off.
rfd = { version = "0.18", default-features = false }
# Own event loop (eframe::create_native): the macOS open-document handler is installed on the
# window library's delegate class between creating and running the loop. Pinned to the exact
# version eframe uses because the delegate class name is an implementation detail.
winit = { version = "=0.30.13", default-features = false }
# Write to USB: the same engine as `lephycrypy usb write` (workspace crate).
lephy-usb = { workspace = true }
# Preview: PNG and JPEG only, decoded in memory with size and allocation limits (preview.rs).
# `image` is already in the graph through eframe (PNG); this adds the JPEG decoder (zune-jpeg).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true
