[package]
name = "lephy-gui"
description = "lephycrypy+ masaüstü arayüzü (1.2; egui/eframe; #![forbid(unsafe_code)])"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "lephycrypy-gui"
path = "src/main.rs"

[features]
# panik hook testi için (CLI ile aynı); dağıtımda asla açılmaz.
fault-injection = ["lephy-core/fault-injection"]

[dependencies]
lephy-core = { workspace = true }
lephy-sys = { workspace = true }
zeroize = { workspace = true }

# persistence kapalı, pano (clipboard) kapalı, gömülü yazı tipleri (default_fonts:
# Ubuntu/UFL + emoji/OFL) kapalı — sistem yazı tipi çalışma anında yüklenir. glow (OpenGL):
# wgpu'dan çok daha küçük bağımlılık ağacı. Linux'ta GUI yoktur (wayland/x11
# sistem kütüphaneleri gerektirir): ikili "desteklenmiyor" der.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit"] }
# Dosya seçme / kaydetme pencereleri (yerel NSOpenPanel / IFileDialog); Linux arka uçları kapalı.
rfd = { version = "0.18", default-features = false }
# Own event loop (eframe::create_native): the macOS open-document handler is installed on the
# window library's delegate class between creating and running the loop. Pinned to the exact
# version eframe uses because the delegate class name is an implementation detail.
winit = { version = "=0.30.13", default-features = false }

[lints]
workspace = true
