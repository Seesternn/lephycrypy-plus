[package]
name = "lephy-core"
description = "lephycrypy+ core: cryptography, format, archive, pipeline (#![forbid(unsafe_code)])"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Fixed salt/nonce/FK injection + a marker string. FOR TESTS ONLY;
# lephy-cli/lephy-gui refuse to build with this feature through a `const` assertion.
test-vectors = []
# Fault injection (a panic in the middle of the pipeline) — ONLY for the panic-hook test
# (tests/fault/panic_hook.sh). CI checks with a marker string that it is absent from releases.
fault-injection = []

[dependencies]
lephy-sys = { workspace = true }
miniz_oxide = { workspace = true }
curve25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
ml-kem = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
subtle = { workspace = true }
chacha20poly1305 = { workspace = true }
aes-gcm = { workspace = true }
aead = { workspace = true }
argon2 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
digest = { workspace = true }
blake3 = { workspace = true }
getrandom = { workspace = true }
unicode-normalization = { workspace = true }
crossbeam-channel = { workspace = true }
cap-std = { workspace = true }
# The password-strength estimate is built in (no zxcvbn).

[dev-dependencies]
hex = "0.4"
# Property-based tests (tests only; fork/timeout off).
proptest = { version = "1.12", default-features = false, features = ["std"] }

# Deterministic vector tests are built only with the `test-vectors` feature.
[[test]]
name = "vectors"
required-features = ["test-vectors"]

# Canary scan (Linux only; the file is `cfg(target_os = "linux")`).
[[test]]
name = "canary"
required-features = ["test-vectors"]

[lints]
workspace = true
