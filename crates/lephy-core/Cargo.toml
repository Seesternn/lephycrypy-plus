[package]
name = "lephy-core"
description = "lephycrypy+ çekirdeği: kriptografi, biçim, arşiv, pipeline (#![forbid(unsafe_code)])"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Açık karar 2: zxcvbn parola gücü; sıfırlanmayan parola kopyaları bırakır, varsayılan kapalı.
strength = []
# R5-02: sabit salt/nonce/FK enjeksiyonu + işaret dizgesi. YALNIZCA testler için;
# lephy-cli/lephy-gui bu feature ile derlenmeyi `const` iddiasıyla reddeder.
test-vectors = []

[dependencies]
lephy-sys = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
subtle = { workspace = true }
chacha20poly1305 = { workspace = true }
aes-gcm = { workspace = true }
aead = { workspace = true }
argon2 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
digest = { workspace = true }
blake3 = { workspace = true }
getrandom = { workspace = true }
unicode-normalization = { workspace = true }
crossbeam-channel = { workspace = true }
# Aşama 2'de: cap-std, tempfile. `strength` feature'ı (zxcvbn) açık karar 2 onaylanırsa.

[dev-dependencies]
hex = "0.4"

# I7 (R5-02): deterministik vektör testleri yalnızca `test-vectors` feature'ı ile derlenir.
[[test]]
name = "vectors"
required-features = ["test-vectors"]

[lints]
workspace = true
