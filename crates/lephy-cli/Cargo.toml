[package]
name = "lephy-cli"
description = "lephycrypy+ command line (#![forbid(unsafe_code)])"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "lephycrypy"
path = "src/main.rs"

[features]
# panic-hook test (tests/fault/panic_hook.sh). Never enabled in distributed builds.
fault-injection = ["lephy-core/fault-injection"]

[dependencies]
lephy-core = { workspace = true }
lephy-sys = { workspace = true }
zeroize = { workspace = true }
lephy-usb = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
