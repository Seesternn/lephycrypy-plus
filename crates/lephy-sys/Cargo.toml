[package]
name = "lephy-sys"
description = "lephycrypy+'s only unsafe/FFI crate: memory locking, process hardening, file system, volumes, terminal, signals, OS integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Dependency budget: only libc (unix), windows-sys (windows), zeroize.
# Any other dependency needs a design change; CI checks with `cargo tree -p lephy-sys --depth 1`.
[dependencies]
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Ioctl",   # vol.rs (USB): STORAGE_DEVICE_DESCRIPTOR, device number
    "Win32_Security",       # vol.rs: TokenElevation
    "Win32_Globalization",  # locale.rs: GetUserDefaultUILanguage
    "Win32_System_Registry", # shell.rs: per-user Explorer integration (HKCU)
    "Win32_UI_Shell",        # shell.rs: SHChangeNotify after (un)registering
    "Win32_UI_WindowsAndMessaging", # capture.rs: window display affinity
]

# The workspace table contains `unsafe_code = "forbid"`; this crate uses its own table.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(miri)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
unwrap_used = "warn"
expect_used = "warn"
