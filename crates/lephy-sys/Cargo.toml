[package]
name = "lephy-sys"
description = "lephycrypy+ tek unsafe/FFI crate'i: bellek kilitleme, süreç sertleştirme, dosya sistemi, birim, terminal, sinyal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Bağımlılık bütçesi: yalnızca libc (unix), windows-sys (windows), zeroize.
# Başka bir bağımlılık tasarım değişikliği gerektirir; CI `cargo tree -p lephy-sys --depth 1` ile denetler.
[dependencies]
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Ioctl",   # vol.rs (USB 1.1): STORAGE_DEVICE_DESCRIPTOR, aygıt numarası
    "Win32_Security",       # vol.rs: TokenElevation
    "Win32_Globalization",  # locale.rs: GetUserDefaultUILanguage
    "Win32_System_Registry", # shell.rs: per-user Explorer integration (HKCU)
    "Win32_UI_Shell",        # shell.rs: SHChangeNotify after (un)registering
]

# workspace tablosu `unsafe_code = "forbid"` içerir; bu crate kendi tablosunu kullanır.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(miri)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
unwrap_used = "warn"
expect_used = "warn"
