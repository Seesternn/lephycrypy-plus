# cargo-audit configuration.
#
# cargo-audit scans the whole Cargo.lock regardless of target. The entries below come only from the
# Linux/BSD accessibility edge (eframe → egui-winit → accesskit_winit → accesskit_unix →
# zbus/zvariant); lephy-gui does not link eframe on Linux, so these crates are not part of the macOS
# and Windows builds. Kind: "unmaintained" (not a vulnerability). deny-gui.toml removes the same
# edge with `exclude = ["accesskit_unix"]`. Re-evaluated whenever eframe/accesskit are updated.
# Last reviewed: 2026-11-17 (maintainer). Review again on every eframe/accesskit upgrade or by
# 2027-05-17, whichever comes first.
[advisories]
ignore = [
    "RUSTSEC-2026-0370", # zvariant — unmaintained
    "RUSTSEC-2026-0371", # zbus_names — unmaintained
    "RUSTSEC-2026-0372", # zvariant_derive — unmaintained
]
