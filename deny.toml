# cargo-deny configuration — STRICT tier: core, CLI, USB.
# Run: `cargo deny --all-features --exclude lephy-gui check`
# The GUI (egui/eframe tree, ~400 crates) is checked separately in a looser tier: deny-gui.toml.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies between internal crates (publish = false) do not count as wildcards.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Removed dependencies
    { crate = "memsec", reason = "entire API is unsafe, rarely maintained; lephy-sys/mem.rs" },
    { crate = "sysinfo", reason = "large; lephy-sys/vol.rs and platform.rs" },
    { crate = "secrecy", reason = "single secret type: SecretBytes/SecretBox" },
    { crate = "signal-hook", reason = "sets SA_RESTART; lephy-sys/signal.rs" },
    { crate = "signal-hook-registry", reason = "sets SA_RESTART; lephy-sys/signal.rs" },
    { crate = "ctrlc", reason = "lephy-sys/signal.rs" },
    # The tool does not use the network
    { crate = "openssl", reason = "no network/TLS" },
    { crate = "openssl-sys", reason = "no network/TLS" },
    { crate = "ring", reason = "no network/TLS" },
    { crate = "native-tls", reason = "no network/TLS" },
    # Older RustCrypto generation: no zeroize feature
    { crate = "hkdf:<0.13", reason = "hkdf ≥ 0.13 for zeroize" },
    { crate = "hmac:<0.13", reason = "hmac ≥ 0.13 for zeroize" },
    { crate = "sha2:<0.11", reason = "sha2 ≥ 0.11 for zeroize" },
    # FFI budget: among internal crates only lephy-sys may depend on libc/windows-sys directly.
    # Third-party wrappers are an allow list reviewed one by one; if a new crate binds to FFI
    # directly, this check fails and asks for a review.
    { crate = "libc", wrappers = [
        "lephy-sys",
        "getrandom",     # OS RNG
        "rustix",        # cap-std (Unix system calls)
        "errno",         # rustix
        "cpufeatures",   # RustCrypto CPU feature detection (AES-NI/ARMv8)
    ], reason = "unsafe/FFI only in lephy-sys among internal crates" },
    { crate = "windows-sys", wrappers = [
        "lephy-sys",
        "rustix", "errno",                       # cap-std chain
        "cap-primitives", "fs-set-times", "io-extras", "winx",
        "anstyle-wincon", "anstyle-query",       # clap coloured output (Windows console)
    ], reason = "unsafe/FFI only in lephy-sys among internal crates" },
    # GUI dependencies cannot leak into the core: this configuration runs with `--exclude lephy-gui`
    # (lephy-gui has its own looser tier: deny-gui.toml). None may appear in core/CLI/USB.
    { crate = "egui", reason = "GUI only in lephy-gui (deny-gui.toml)" },
    { crate = "eframe", reason = "GUI only in lephy-gui (deny-gui.toml)" },
    { crate = "winit", reason = "GUI only in lephy-gui (deny-gui.toml)" },
    # USB: lephy-usb/plist_lite instead of the plist tree; a chacha20 key stream instead of
    # rand_chacha (to keep the number of unaudited crates small).
    { crate = "plist", reason = "lephy-usb uses its own small parser (plist_lite)" },
    { crate = "rand_chacha", reason = "filling uses a chacha20 key stream" },
]
# Unavoidable duplicate versions (Windows target only; the cap-std chain pulls in older
# windows-sys). Removed when upstream updates; any new duplicate is still caught by "deny".
skip = [
    { crate = "io-lifetimes@2.0.4", reason = "fs-set-times 0.20 depends on the old io-lifetimes (cap-std 4)" },
    { crate = "syn@2.0.119", reason = "curve25519-dalek-derive (proc macro, x86_64 SIMD backend only) has not moved to syn 3" },
]
skip-tree = [
    { crate = "windows-sys@0.59.0", reason = "winx/fs-set-times (cap-std 4); subtree windows-targets 0.52" },
    { crate = "windows-sys@0.60.2", reason = "io-extras (cap-std 4); subtree windows-targets 0.53" },
]
