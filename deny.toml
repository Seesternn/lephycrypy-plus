# cargo-deny yapılandırması — SIKI kademe: çekirdek, CLI, USB.
# Çalıştırma: `cargo deny --all-features --exclude lephy-gui check`
# GUI (egui/eframe zinciri, ~400 crate) ayrı ve gevşek kademede denetlenir: deny-gui.toml.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
# İç crate'ler (publish = false) arası path bağımlılıkları wildcard sayılmaz.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Kaldırılan bağımlılıklar
    { crate = "memsec", reason = "tüm API unsafe, seyrek bakım; lephy-sys/mem.rs" },
    { crate = "sysinfo", reason = "büyük; lephy-sys/vol.rs ve platform.rs" },
    { crate = "secrecy", reason = "tek sır türü SecretBytes/SecretBox" },
    { crate = "signal-hook", reason = "SA_RESTART koyar; lephy-sys/signal.rs" },
    { crate = "signal-hook-registry", reason = "SA_RESTART koyar; lephy-sys/signal.rs" },
    { crate = "ctrlc", reason = "lephy-sys/signal.rs" },
    # Araç ağa çıkmaz
    { crate = "openssl", reason = "ağ/TLS yok" },
    { crate = "openssl-sys", reason = "ağ/TLS yok" },
    { crate = "ring", reason = "ağ/TLS yok" },
    { crate = "native-tls", reason = "ağ/TLS yok" },
    # Eski kuşak RustCrypto: zeroize feature'ı yok
    { crate = "hkdf:<0.13", reason = "zeroize için hkdf ≥ 0.13" },
    { crate = "hmac:<0.13", reason = "zeroize için hmac ≥ 0.13" },
    { crate = "sha2:<0.11", reason = "zeroize için sha2 ≥ 0.11" },
    # FFI bütçesi: iç crate'lerden yalnızca lephy-sys libc/windows-sys'e doğrudan
    # bağımlı olabilir. Üçüncü taraf wrapper'lar tek tek incelenmiş izin listesidir; yeni bir
    # crate doğrudan FFI'ya bağlanırsa bu kontrol kırmızı yanar ve inceleme ister.
    { crate = "libc", wrappers = [
        "lephy-sys",
        "getrandom",     # OS RNG
        "rustix",        # cap-std (Unix sistem çağrıları)
        "errno",         # rustix
        "cpufeatures",   # RustCrypto CPU özellik tespiti (AES-NI/ARMv8)
    ], reason = "unsafe/FFI iç crate'lerde yalnızca lephy-sys" },
    { crate = "windows-sys", wrappers = [
        "lephy-sys",
        "rustix", "errno",                       # cap-std zinciri
        "cap-primitives", "fs-set-times", "io-extras", "winx",
        "anstyle-wincon", "anstyle-query",       # clap renkli çıktı (Windows konsol)
    ], reason = "unsafe/FFI iç crate'lerde yalnızca lephy-sys" },
    # GUI bağımlılıkları çekirdeğe sızamaz: bu yapılandırma `--exclude lephy-gui` ile çalışır
    # (lephy-gui ayrı, gevşek kademe: deny-gui.toml). Çekirdek/CLI/USB'de hiçbiri bulunmamalı.
    { crate = "egui", reason = "GUI yalnızca lephy-gui (1.2; deny-gui.toml)" },
    { crate = "eframe", reason = "GUI yalnızca lephy-gui (1.2; deny-gui.toml)" },
    { crate = "winit", reason = "GUI yalnızca lephy-gui (1.2; deny-gui.toml)" },
    # USB (1.1): plist zinciri yerine lephy-usb/plist_lite; rand_chacha yerine chacha20 anahtar
    # akışı (denetlenmemiş crate sayısını büyütmemek).
    { crate = "plist", reason = "lephy-usb kendi küçük ayrıştırıcısını kullanır (plist_lite)" },
    { crate = "rand_chacha", reason = "doldurma chacha20 anahtar akışıyla yapılır" },
]
# Kaçınılmaz çift sürümler (yalnızca Windows hedefinde; cap-std zinciri eski windows-sys'leri
# çeker). Yukarı akış güncellendiğinde kaldırılır; yeni çift sürüm yine "deny" ile yakalanır.
skip = [
    { crate = "io-lifetimes@2.0.4", reason = "fs-set-times 0.20 eski io-lifetimes'e bağlı (cap-std 4)" },
    { crate = "syn@2.0.119", reason = "curve25519-dalek-derive (proc macro, x86_64 SIMD backend only) has not moved to syn 3" },
]
skip-tree = [
    { crate = "windows-sys@0.59.0", reason = "winx/fs-set-times (cap-std 4); alt ağaç windows-targets 0.52" },
    { crate = "windows-sys@0.60.2", reason = "io-extras (cap-std 4); alt ağaç windows-targets 0.53" },
]
