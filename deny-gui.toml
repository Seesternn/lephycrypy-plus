# cargo-deny yapılandırması — GUI kademesi (1.2): tüm workspace + lephy-gui (egui/eframe).
# Çalıştırma: `cargo deny --all-features --config deny-gui.toml check`
#
# Neden ayrı: egui/eframe/winit zinciri onlarca üçüncü taraf FFI crate'i (objc2, windows-sys,
# libc …) ve kaçınılmaz çift sürümler getirir; çekirdeğin FFI wrapper izin listesi (deny.toml)
# burada pratik değildir. Lisans, güvenlik uyarısı, kaynak ve sert yasaklar aynen uygulanır;
# çift sürüm yalnızca uyarıdır. Çekirdeğin sıkı kuralları deny.toml'da (`--exclude lephy-gui`).

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false
# accesskit_unix (zbus, async-process, signal-hook-registry …) yalnızca Linux/BSD kenarıdır;
# lephy-gui Linux'ta eframe'e bağlanmaz. cargo-deny hedef birleşimi bu kenarı
# yine de ekler (yanlış pozitif); bu yüzden grafikten çıkarılır.
exclude = ["accesskit_unix"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "memsec", reason = "lephy-sys/mem.rs" },
    { crate = "sysinfo", reason = "lephy-sys" },
    { crate = "secrecy", reason = "single secret type: SecretBytes/SecretBox" },
    { crate = "openssl", reason = "ağ/TLS yok" },
    { crate = "openssl-sys", reason = "ağ/TLS yok" },
    { crate = "ring", reason = "ağ/TLS yok" },
    { crate = "native-tls", reason = "ağ/TLS yok" },
    { crate = "hkdf:<0.13", reason = "old version without zeroize support" },
    { crate = "hmac:<0.13", reason = "old version without zeroize support" },
    { crate = "sha2:<0.11", reason = "old version without zeroize support" },
    { crate = "plist", reason = "lephy-usb/plist_lite" },
    { crate = "rand_chacha", reason = "chacha20 anahtar akışı" },
    { crate = "ctrlc", reason = "SA_RESTART koyar; lephy-sys/signal.rs" },
    # GUI'nin varsayılan özellikleri bilinçli olarak kapalı: wgpu (büyük grafik yığını),
    # pano (clipboard: parola sızıntısı riski), kalıcılık (ron/serde).
    { crate = "wgpu", reason = "glow arka ucu seçildi" },
    { crate = "arboard", reason = "pano kapalı" },
    { crate = "ron", reason = "persistence kapalı" },
]
