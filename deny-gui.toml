# cargo-deny configuration — GUI tier: the whole workspace + lephy-gui (egui/eframe).
# Run: `cargo deny --all-features --config deny-gui.toml check`
#
# Why separate: the egui/eframe/winit tree brings dozens of third-party FFI crates (objc2, windows-sys,
# libc …) and unavoidable duplicate versions; the core's FFI wrapper allow list (deny.toml) is not
# practical here. Licences, advisories, sources and hard bans apply unchanged; duplicate versions
# are only warnings. The core's strict rules are in deny.toml (`--exclude lephy-gui`).

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false
# accesskit_unix (zbus, async-process, signal-hook-registry …) is only a Linux/BSD edge;
# lephy-gui does not link eframe on Linux. cargo-deny's target union adds this edge
# anyway (a false positive), so it is removed from the graph.
exclude = ["accesskit_unix"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "memsec", reason = "lephy-sys/mem.rs" },
    { crate = "sysinfo", reason = "lephy-sys" },
    { crate = "secrecy", reason = "single secret type: SecretBytes/SecretBox" },
    { crate = "openssl", reason = "no network/TLS" },
    { crate = "openssl-sys", reason = "no network/TLS" },
    { crate = "ring", reason = "no network/TLS" },
    { crate = "native-tls", reason = "no network/TLS" },
    { crate = "hkdf:<0.13", reason = "old version without zeroize support" },
    { crate = "hmac:<0.13", reason = "old version without zeroize support" },
    { crate = "sha2:<0.11", reason = "old version without zeroize support" },
    { crate = "plist", reason = "lephy-usb/plist_lite" },
    { crate = "rand_chacha", reason = "chacha20 key stream" },
    { crate = "ctrlc", reason = "sets SA_RESTART; lephy-sys/signal.rs" },
    # The GUI's default features are off on purpose: wgpu (large graphics stack),
    # clipboard (risk of password leaks), persistence (ron/serde).
    { crate = "wgpu", reason = "the glow back end was chosen" },
    { crate = "arboard", reason = "clipboard off" },
    { crate = "ron", reason = "persistence off" },
]
