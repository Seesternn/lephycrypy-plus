# CI. Tüm `uses:` tam 40-hex SHA ile sabitlenir; üst düzey `permissions: {}`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  privacy:
    # No secrets or personal data anywhere in the history; every commit uses the noreply address.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: install gitleaks 8.30.1 (checksum pinned)
        run: |
          set -euo pipefail
          v=8.30.1
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          if ! "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 \
              --report-format csv --report-path "$RUNNER_TEMP/leaks.csv" .; then
            # Rule and location only; secret values are redacted.
            cut -d, -f1,3 "$RUNNER_TEMP/leaks.csv" | sort | uniq -c | sort -rn | head -n 60
            exit 1
          fi
      - name: author and committer addresses are noreply
        run: |
          set -euo pipefail
          bad=$(git log --all --format='%ae%n%ce' | sort -u | grep -v '@users.noreply.github.com$' | grep -vx 'noreply@github.com' || true)
          if [ -n "$bad" ]; then echo "::error::non-noreply commit address in history"; exit 1; fi

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p lephy-core -p lephy-sys --all-features --all-targets -- -D warnings
      - name: unsafe only in lephy-sys
        run: |
          set -euo pipefail
          # Anahtar sözcük kullanımı ve lint gevşetme aranır; dizge içindeki "unsafe"
          # (ör. --restore-symlinks unsafe) sayılmaz. Asıl zorlama #![forbid(unsafe_code)].
          if grep -rnE '\bunsafe[[:space:]]*(\{|fn\b|impl\b|trait\b|extern\b)|allow\(unsafe_code' crates --include='*.rs' | grep -v '^crates/lephy-sys/'; then
            echo "::error::unsafe outside lephy-sys"; exit 1; fi
      - name: workflow lint (SHA pin + permissions)
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml; do
            if grep -nE '^\s*-?\s*uses:' "$f" | grep -vE 'uses:\s*[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(/[A-Za-z0-9_./-]+)?@[0-9a-f]{40}(\s|#|$)'; then
              echo "::error file=$f::uses: not pinned to 40-hex SHA"; exit 1; fi
            grep -qE '^permissions:\s*\{\}\s*$' "$f" || { echo "::error file=$f::top-level permissions: {} missing"; exit 1; }
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.95.0"
      - run: cargo build --locked --workspace
      # Unix'te sinyal/pty testleri (crates/lephy-cli/tests/signals.rs) ve fuzz regresyonları dahil.
      - run: cargo test --locked --workspace
      - run: cargo test --locked -p lephy-core --features test-vectors
      - name: panic hook (fault-injection + release/panic=abort)
        if: runner.os == 'macOS'
        run: bash tests/fault/panic_hook.sh

  linux-best-effort:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.95.0"
      - run: cargo check --locked --workspace
      - name: kanarya taraması (/proc/self/mem)
        run: cargo test --locked -p lephy-core --features test-vectors --test canary -- --nocapture
      - name: miri (lephy-sys, cfg(miri) arka ucu)
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-11-01 --component miri,rust-src --profile minimal
          cargo +nightly-2026-11-01 miri setup
          cargo +nightly-2026-11-01 miri test -p lephy-sys
      - uses: taiki-e/install-action@328a871ad8f62ecac78390391f463ccabc974b72 # v2.69.9
        with:
          tool: cargo-fuzz@0.13.2
      - name: fuzz smoke (60 sn/hedef)
        working-directory: fuzz
        run: |
          set -euo pipefail
          for t in header archive_entry names decrypt_known_key envelope; do
            mkdir -p "corpus/$t"
            cargo +nightly-2026-11-01 fuzz run --target x86_64-unknown-linux-gnu "$t" "corpus/$t" "seeds/$t" -- -max_total_time=60
          done
      - name: fuzz çökme girdileri (başarısızlıkta)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  supply-chain:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.95.0"
      - uses: taiki-e/install-action@328a871ad8f62ecac78390391f463ccabc974b72 # v2.69.9
        with:
          tool: cargo-deny@0.21.0,cargo-audit@0.23.0,cargo-vet@0.10.3
      # İki kademe: sıkı (çekirdek/CLI/USB; FFI bütçesi, çift sürüm deny, GUI crate'leri yasak)
      # ve GUI (egui/eframe zinciri; lisans/advisory/kaynak/sert yasaklar, çift sürüm uyarı).
      - name: cargo deny — sıkı kademe (çekirdek, CLI, USB)
        run: cargo deny --all-features --exclude lephy-gui check
      - name: cargo deny — GUI kademesi
        run: cargo deny --all-features --config deny-gui.toml check
      - run: cargo audit --deny warnings
      - name: cargo vet
        run: cargo vet --locked
      - name: no new crates among vet exemptions
        # PR: new exempted crate names fail the job. Push to main: they are reported as a warning
        # so that an intentional, reviewed addition is visible in the run summary.
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          names() { grep -o '^\[\[exemptions\.[^]]*\]\]' | sed -e 's/^\[\[exemptions\.//' -e 's/\]\]$//' | sort -u; }
          if [ "$EVENT" = "pull_request" ]; then
            git fetch -q --depth=1 origin "$BASE_REF"
            base="origin/$BASE_REF"
          else
            base="$BEFORE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
                || ! git fetch -q --depth=1 origin "$base" 2>/dev/null; then
              echo "no comparable base commit; skipping"; exit 0
            fi
          fi
          git show "$base:supply-chain/config.toml" | names > "$RUNNER_TEMP/base.txt" || true
          names < supply-chain/config.toml > "$RUNNER_TEMP/head.txt"
          added=$(comm -13 "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt")
          if [ -n "$added" ]; then
            echo "New exempted crates:"; echo "$added"
            if [ "$EVENT" = "pull_request" ]; then echo "::error::new crates exempted from cargo-vet"; exit 1; fi
            echo "::warning::new crates exempted from cargo-vet: $(echo $added | tr '\n' ' ')"
          fi

  budget:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.95.0"
      - name: lephy-sys dependency budget
        run: |
          set -euo pipefail
          for t in aarch64-apple-darwin x86_64-pc-windows-msvc x86_64-unknown-linux-gnu; do
            cargo tree --locked -p lephy-sys -e normal --depth 1 --prefix none --target "$t" \
              | awk '{print $1}' | sort -u > /tmp/deps.txt
            if grep -vxE 'lephy-sys|libc|windows-sys|zeroize' /tmp/deps.txt; then
              echo "::error::lephy-sys has an unbudgeted dependency for $t"; exit 1; fi
          done
      - name: forbidden crates absent
        run: |
          set -euo pipefail
          ! cargo tree --locked --workspace --prefix none | grep -E '^(secrecy|signal-hook|ctrlc|memsec|sysinfo) '
      - name: test-vectors must not build into lephy-cli / lephy-gui
        run: |
          set -euo pipefail
          for p in lephy-cli lephy-gui; do
            if cargo build --locked -p "$p" --features lephy-core/test-vectors; then
              echo "::error::$p built with test-vectors"; exit 1; fi
          done
      - name: zeroize kenarları mevcut, Vec döndüren AEAD ve test feature'ları yok
        run: |
          set -euo pipefail
          cargo tree --locked -p lephy-cli -e features --prefix none --target all > /tmp/feat.txt
          for f in chacha20 aes ghash hmac sha2 digest blake3; do
            grep -qF "$f feature \"zeroize\"" /tmp/feat.txt || { echo "::error::$f/zeroize eksik"; exit 1; }
          done
          for f in 'aead feature "alloc"' 'lephy-core feature "test-vectors"' 'lephy-core feature "fault-injection"'; do
            if grep -qF "$f" /tmp/feat.txt; then echo "::error::dağıtım grafiğinde olmamalı: $f"; exit 1; fi
          done
