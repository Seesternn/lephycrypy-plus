# Dependabot only opens pull requests; there is no auto-merge workflow. Cargo.lock is committed;
# `cargo update` happens only through Dependabot pull requests.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
